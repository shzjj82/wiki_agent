<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺满整屏，同时启用 env(safe-area-inset-*)。
         不写的话 iOS 上 env() 恒为 0，刘海 / Home 指示条会压住内容。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="wiki-agent" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>wiki-agent</title>
    <script>
      // Mac 桌面端端口固定。更新后 WebKit 可能继续用旧的 index.html，
      // 去要已经不存在的入口脚本，然后报 Importing a module script failed 并停住。
      // 入口脚本自己失败时不会有 vite:preloadError，所以这里直接看错误信息和空白页。
      (function () {
        var key = "editor:module-reload";
        function failed(message) {
          var text = String(message || "");
          return (
            text.indexOf("Importing a module script failed") !== -1 ||
            text.indexOf("Failed to fetch dynamically imported module") !== -1 ||
            text.indexOf("error loading dynamically imported module") !== -1
          );
        }
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(key)) return;
            sessionStorage.setItem(key, "1");
          } catch (err) {
            return;
          }
          var url = new URL(window.location.href);
          url.searchParams.set("boot", String(Date.now()));
          window.location.replace(url.toString());
        }
        window.addEventListener(
          "error",
          function (event) {
            if (failed(event && event.message)) reloadOnce();
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          if (failed(reason && (reason.message || reason))) reloadOnce();
        });
        window.addEventListener("vite:preloadError", function (event) {
          if (event && event.preventDefault) event.preventDefault();
          reloadOnce();
        });
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) {
              try {
                sessionStorage.removeItem(key);
              } catch (err) {
                /* 隐私模式没有 sessionStorage 时，这次就不记了 */
              }
              return;
            }
            reloadOnce();
          }, 3000);
        });
      })();
    </script>
    <script>
      // crypto.randomUUID 只在安全上下文（https / localhost）可用，
      // 通过 http://ip:port 访问时不存在，会导致应用启动即白屏。这里补一个实现。
      (function () {
        var c = window.crypto || {};
        if (typeof c.randomUUID === "function") return;
        var hex = function (b, i) {
          var v = b[i].toString(16);
          return v.length < 2 ? "0" + v : v;
        };
        c.randomUUID = function () {
          if (typeof c.getRandomValues === "function") {
            var b = new Uint8Array(16);
            c.getRandomValues(b);
            b[6] = (b[6] & 0x0f) | 0x40;
            b[8] = (b[8] & 0x3f) | 0x80;
            return (
              hex(b, 0) + hex(b, 1) + hex(b, 2) + hex(b, 3) + "-" +
              hex(b, 4) + hex(b, 5) + "-" +
              hex(b, 6) + hex(b, 7) + "-" +
              hex(b, 8) + hex(b, 9) + "-" +
              hex(b, 10) + hex(b, 11) + hex(b, 12) + hex(b, 13) + hex(b, 14) + hex(b, 15)
            );
          }
          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (ch) {
            var r = (Math.random() * 16) | 0;
            return (ch === "x" ? r : (r & 0x3) | 0x8).toString(16);
          });
        };
        if (!window.crypto) window.crypto = c;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
