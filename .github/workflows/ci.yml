name: ci

# 推送和合并请求时先过一遍编辑器检查，别等打 tag 打包时才发现编译不过。
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm --filter @myblog/editor typecheck

      - name: 代码规范
        run: pnpm --filter @myblog/editor lint

      - name: 单元测试
        run: pnpm --filter @myblog/editor test
